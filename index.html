<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>POKER VIBE UA — контакти</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background:
  linear-gradient(rgba(17, 24, 39, 0.55), rgba(17, 24, 39, 0.75)),
  url(“IMG_1114.png”) center / cover no-repeat fixed;
    }

    main {
      width: min(100%, 480px);
      padding: 36px 28px;
      border: 1px solid #344155;
      border-radius: 24px;
      background: rgba(24, 34, 50, 0.94);
      text-align: center;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.3);
    }

    .mark 
      display: grid;
      width: 58px;
      height: 58px;
      margin: 0 auto 20px;
      place-items: center;
      border-radius: 18px;
      background: #f2c14e;
      color: #111827;
      font-size: 26px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 38px);
      letter-spacing: 0.04em;
    }

    .id {
      margin: 12px 0 28px;
      color: #aebbd0;
      font-size: 15px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: block;
      padding: 16px 18px;
      border: 1px solid #39475e;
      border-radius: 14px;
      background: #202c40;
      color: #f8fafc;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #2a3951;
    }

    .link.primary {
      border-color: #f2c14e;
      background: #f2c14e;
      color: #111827;
    }

    .link.primary:hover {
      background: #ffd36b;
    }

    .label {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      font-weight: 400;
      opacity: 0.8;
    }

    footer {
      margin-top: 26px;
      color: #91a0b6;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">PV</div>
    <h1>POKER VIBE UA</h1>
    <p class="id">ID: 889-131</p>

    <nav class="links" aria-label="Контакти">
      <a
        class="link primary"
        href="https://t.me/+7Ab4kYE21vY1MTI0"
        target="_blank"
        rel="noopener noreferrer"
      >
        Група з новинами
        <span class="label">Telegram</span>
      </a>

      <a
        class="link"
        href="https://t.me/POKER_VIBE_UA"
        target="_blank"
        rel="noopener noreferrer"
      >
        Telegram адміністратора
        <span class="label">@POKER_VIBE_UA</span>
      </a>
    </nav>

    <footer>Контакти POKER VIBE UA</footer>
  </main>
</body>
</html>
